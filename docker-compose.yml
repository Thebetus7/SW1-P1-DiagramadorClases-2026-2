services:
  # ==========================================================
  # 1. Base de Datos Relacional: PostgreSQL 16
  # ==========================================================
  postgres_db:
    image: postgres:16-alpine
    container_name: diag_postgres
    restart: always
    environment:
      POSTGRES_DB: sw1_diag_clases_2026_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - diag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 2. Backend: Spring Boot + Java 17 + AWS SDK DynamoDB
  # ==========================================================
  backend:
    build:
      context: ./back_diagramador
      dockerfile: Dockerfile
    container_name: diag_backend
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/sw1_diag_clases_2026_2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password123}
      # Conexión directa a AWS DynamoDB administrado (vía IAM Role)
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      DIAGRAM_UPLOAD_DIR: /app/uploads/diagrams
    volumes:
      - uploads_data:/app/uploads
    networks:
      - diag_network

  # ==========================================================
  # 3. Frontend: Next.js + React 19 + Tailwind CSS
  # ==========================================================
  frontend:
    build:
      context: ./front_diag_clases
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: /ws
        NEXT_PUBLIC_GEMINI_API_KEY: ${NEXT_PUBLIC_GEMINI_API_KEY:-}
    container_name: diag_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - diag_network

  # ==========================================================
  # 4. Reverse Proxy: Nginx en Puerto 80
  # ==========================================================
  proxy:
    image: nginx:alpine
    container_name: diag_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - diag_network

networks:
  diag_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

