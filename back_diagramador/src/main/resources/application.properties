spring.application.name=back_diagramador
server.port=8080

# Base de datos (H2 en memoria con persistencia opcional / soporte para cambiar a PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/sw1_diag_clases_2026_2
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=123456789

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.example.back_diagramador=INFO
