spring.application.name=back_diagramador
server.port=8080

# Encoding UTF-8 estricto
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Base de datos (Soporte flexible para variables de entorno o local por defecto)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sw1_diag_clases_2026_2}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456789}

# Amazon DynamoDB (NoSQL Documental para Chat y Propuestas)
amazon.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8005}
amazon.aws.region=${AWS_REGION:us-east-1}
amazon.aws.accesskey=${AWS_ACCESS_KEY_ID:dummy}
amazon.aws.secretkey=${AWS_SECRET_ACCESS_KEY:dummy}

# MinIO Object Storage (Compatible con AWS S3)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:sw1-diagramador-assets}
minio.region=${AWS_REGION:us-east-1}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.example.back_diagramador=INFO

# Multipart Upload Configuration (15MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Storage configuration for diagram attachments
diagram.storage.upload-dir=${DIAGRAM_UPLOAD_DIR:uploads/diagrams}

