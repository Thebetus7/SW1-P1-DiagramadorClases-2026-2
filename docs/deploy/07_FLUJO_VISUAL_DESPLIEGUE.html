<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Interactivo de Despliegue AWS AL2023 + DynamoDB</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --border-color: #475569;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --success-color: #22c55e;
            --code-bg: #090d16;
            --btn-copy: #2563eb;
        }

        .light-mode {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #f1f5f9;
            --border-color: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --success-color: #16a34a;
            --code-bg: #1e293b;
            --btn-copy: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-theme {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 65px);
        }

        /* Sidebar con Pipeline */
        .sidebar {
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .pipeline-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            position: relative;
        }

        .pipeline-card:hover {
            border-color: var(--accent-color);
        }

        .pipeline-card.active {
            border-color: var(--accent-color);
            background-color: rgba(56, 189, 248, 0.15);
        }

        .pipeline-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-step {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Main View */
        .content {
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .content-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .content-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .step-block {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .step-title {
            font-size: 1.15rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .meta-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 0.25rem;
            font-weight: 600;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        .tag-context {
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .code-container {
            background-color: var(--code-bg);
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        pre {
            padding: 1rem;
            overflow-x: auto;
            color: #e2e8f0;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background-color: var(--btn-copy);
            color: #fff;
            border: none;
            padding: 0.35rem 0.75rem;
            border-radius: 0.35rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        .copy-btn:hover {
            opacity: 0.9;
        }

        .note-box {
            background-color: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--accent-color);
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            border-radius: 0 0.35rem 0.35rem 0;
        }

        .tip-box {
            background-color: rgba(34, 197, 94, 0.1);
            border-left: 4px solid var(--success-color);
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            border-radius: 0 0.35rem 0.35rem 0;
        }

        /* Checkbox de progreso */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>🚀</span>
            <span>Diagramador UML — Pipeline de Despliegue AWS AL2023 & DynamoDB</span>
        </div>
        <div class="header-actions">
            <button class="btn-theme" onclick="toggleTheme()">🌓 Alternar Tema</button>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar Pipeline -->
        <aside class="sidebar" id="sidebar">
            <!-- Nodos del pipeline cargados por JS -->
        </aside>

        <!-- Main Workspace Content -->
        <main class="content" id="mainContent">
            <!-- Contenido dinámico -->
        </main>
    </div>

    <script>
        const modules = [
            {
                id: "00",
                step: "00. Resumen General",
                title: "Arquitectura y Matriz de Red",
                desc: "Topología EC2 AL2023, Amazon DynamoDB, PostgreSQL y costos.",
                steps: [
                    {
                        title: "Arquitectura y Topología en Producción",
                        context: "[AWS US-EAST-1]",
                        path: "docs/deploy/00_RESUMEN_GENERAL.md",
                        desc: "Monorepo orquestado con Nginx Reverse Proxy (80/443), Next.js 16 (3000), Spring Boot 3.5 (8080), PostgreSQL 16 y Amazon DynamoDB en modo Serverless Always Free.",
                        code: `# Diagrama de Flujo Rápido de Tráfico:
# Usuario -> Nginx (:80/:443) -> /api/ & /ws -> Spring Boot (:8080)
#                               -> /        -> Next.js (:3000)
# Spring Boot -> PostgreSQL (Relacional)
#             -> Amazon DynamoDB (Chat & Proposals NoSQL)
#             -> MinIO (Assets S3)`,
                        verification: "Verifica que los puertos 8080 y 5432 permanezcan cerrados al público en el Security Group."
                    }
                ]
            },
            {
                id: "01",
                step: "01. Variables & Compose",
                title: "Configurar el Proyecto",
                desc: "Preparación de .env y docker-compose.yml con DynamoDB.",
                steps: [
                    {
                        title: "Creación del archivo .env de Producción",
                        context: "[PC LOCAL / SERVIDOR]",
                        path: "./.env",
                        desc: "Configura las variables de base de datos y la región de AWS.",
                        code: `DB_PASSWORD=<TU_DB_PASSWORD_PRODUCCION>
AWS_REGION=us-east-1
# Dejar DYNAMODB_ENDPOINT vacío para conectar a DynamoDB administrado en AWS:
DYNAMODB_ENDPOINT=
MINIO_ROOT_USER=minioadmin
MINIO_ROOT_PASSWORD=<TU_MINIO_SECRET_PASSWORD>
MINIO_BUCKET_NAME=sw1-diagramador-assets
NEXT_PUBLIC_GEMINI_API_KEY=<TU_GEMINI_API_KEY>`,
                        verification: "Verifica con: git check-ignore -v .env"
                    }
                ]
            },
            {
                id: "02",
                step: "02. Infraestructura AWS",
                title: "EC2 AL2023, IAM & DynamoDB",
                desc: "Creación de la tabla DynamoDB, Security Group e instancia EC2.",
                steps: [
                    {
                        title: "Crear Tabla en Amazon DynamoDB",
                        context: "[CONSOLA AWS / CLI]",
                        path: "us-east-1",
                        desc: "Crea la tabla DiagramChatMessages con clave de partición diagramId (N), ordenación createdAt (S) y el índice secundario MessageIdIndex.",
                        code: `aws dynamodb create-table \\
    --table-name DiagramChatMessages \\
    --attribute-definitions \\
        AttributeName=diagramId,AttributeType=N \\
        AttributeName=createdAt,AttributeType=S \\
        AttributeName=id,AttributeType=S \\
    --key-schema \\
        AttributeName=diagramId,KeyType=HASH \\
        AttributeName=createdAt,KeyType=RANGE \\
    --global-secondary-indexes \\
        "[{\\"IndexName\\": \\"MessageIdIndex\\", \\"KeySchema\\": [{\\"AttributeName\\": \\"id\\", \\"KeyType\\": \\"HASH\\"}], \\"Projection\\": {\\"ProjectionType\\": \\"ALL\\"}}]" \\
    --billing-mode PAY_PER_REQUEST \\
    --region us-east-1`,
                        verification: "aws dynamodb describe-table --table-name DiagramChatMessages --query 'Table.TableStatus'"
                    },
                    {
                        title: "Lanzar Instancia EC2 Amazon Linux 2023",
                        context: "[CONSOLA AWS EC2]",
                        path: "EC2 > Instances",
                        desc: "Selecciona Amazon Linux 2023 AMI, tipo t3.small o t2.micro, 30 GB EBS gp3 y asigna el IAM Role EC2-DynamoDB-Diagramador-Role con el Security Group secgroup-diagramador-uml-prod.",
                        code: `# Security Group requerido:
# Puerto 22 (SSH)
# Puerto 80 (HTTP)
# Puerto 443 (HTTPS)`,
                        verification: "Espera a que el estado sea 'Running' y copie la IPv4 pública."
                    }
                ]
            },
            {
                id: "03",
                step: "03. Herramientas AL2023",
                title: "Instalar Docker & Swap",
                desc: "Aprovisionamiento de Docker, Docker Compose y 2 GB de memoria Swap.",
                steps: [
                    {
                        title: "Conexión SSH y Memoria Swap de 2 GB",
                        context: "[SSH / SERVIDOR]",
                        path: "/home/ec2-user",
                        desc: "Crea un swapfile de 2 GB para garantizar compilaciones fluidas sin caídas por Out-Of-Memory.",
                        code: `sudo dd if=/dev/zero of=/swapfile bs=128M count=16
sudo chmod 600 /swapfile
sudo mkswap /swapfile
sudo swapon /swapfile
echo '/swapfile swap swap defaults 0 0' | sudo tee -a /etc/fstab`,
                        verification: "free -h (debe indicar Swap: 2.0Gi)"
                    },
                    {
                        title: "Instalar Docker Engine y Compose en AL2023",
                        context: "[SSH / SERVIDOR]",
                        path: "/usr/bin",
                        desc: "Instalación nativa con dnf y activación del demonio systemd.",
                        code: `sudo dnf update -y
sudo dnf install -y docker git
DOCKER_CONFIG=\${DOCKER_CONFIG:-/usr/local/lib/docker}
sudo mkdir -p $DOCKER_CONFIG/cli-plugins
sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m) -o $DOCKER_CONFIG/cli-plugins/docker-compose
sudo chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
sudo systemctl enable --now docker
sudo usermod -aG docker ec2-user
newgrp docker`,
                        verification: "docker compose version"
                    }
                ]
            },
            {
                id: "04",
                step: "04. Desplegar y Verificar",
                title: "Primer Despliegue y Pruebas",
                desc: "Clonación, Docker Compose Up y verificación de conexión con DynamoDB.",
                steps: [
                    {
                        title: "Clonar y Levantar Servicios",
                        context: "[SSH / SERVIDOR]",
                        path: "/home/ec2-user/app_diagramador",
                        desc: "Construcción y arranque de los 5 contenedores en segundo plano.",
                        code: `git clone https://github.com/<TU_USUARIO>/<TU_REPOSITORIO>.git app_diagramador
cd app_diagramador
# Crear .env con tus claves
docker compose up -d --build`,
                        verification: "docker compose ps"
                    },
                    {
                        title: "Auditar Conexión con Amazon DynamoDB",
                        context: "[SSH / SERVIDOR]",
                        path: "/home/ec2-user/app_diagramador",
                        desc: "Valida en los logs de Spring Boot la confirmación de la tabla NoSQL.",
                        code: `docker compose logs backend | grep -i "DynamoDB"`,
                        verification: "Salida esperada: 'La tabla DynamoDB DiagramChatMessages ya existe y está lista para operar.'"
                    }
                ]
            },
            {
                id: "05",
                step: "05. Actualizar Producción",
                title: "Pipeline de Actualización",
                desc: "Backup de base de datos relacional, Git Pull y rebuild en caliente.",
                steps: [
                    {
                        title: "Actualizar sin Caídas ni Pérdida de Datos",
                        context: "[SSH / SERVIDOR]",
                        path: "/home/ec2-user/app_diagramador",
                        desc: "Respalda PostgreSQL y actualiza solo frontend y backend.",
                        code: `docker exec -t diag_postgres pg_dump -U postgres sw1_diag_clases_2026_2 > "backup_$(date +%Y%m%d_%H%M%S).sql"
git pull origin main
docker compose up -d --build --no-deps backend frontend proxy
docker image prune -f`,
                        verification: "docker compose ps (diag_postgres debe conservar su uptime)"
                    }
                ]
            },
            {
                id: "06",
                step: "06. Apagar y Reactivar",
                title: "Control de Costos AWS",
                desc: "Detener la instancia para frenar facturación y procedimiento de encendido.",
                steps: [
                    {
                        title: "Apagado y Encendido Controlado",
                        context: "[CONSOLA AWS / SSH]",
                        path: "EC2 > Instance state",
                        desc: "Usa 'Stop' para suspender el cómputo sin perder volúmenes EBS ni tablas DynamoDB.",
                        code: `# Para apagar contenedores antes de Stop:
docker compose down

# Tras reiniciar en AWS (Start Instance):
# Los contenedores inician automáticamente gracias a 'restart: always'.
docker compose ps`,
                        verification: "Accede a http://<NUEVA_IP_PUBLICA> en el navegador web."
                    }
                ]
            }
        ];

        let currentModuleIndex = 0;

        function renderSidebar() {
            const sidebar = document.getElementById("sidebar");
            sidebar.innerHTML = "";

            modules.forEach((mod, idx) => {
                const card = document.createElement("div");
                card.className = `pipeline-card ${idx === currentModuleIndex ? "active" : ""}`;
                card.onclick = () => selectModule(idx);

                card.innerHTML = `
                    <div class="pipeline-card-header">
                        <span class="badge-step">${mod.step}</span>
                        <input type="checkbox" id="chk-${mod.id}" onclick="event.stopPropagation(); toggleCheck('${mod.id}')" ${localStorage.getItem('deploy_chk_' + mod.id) === 'true' ? 'checked' : ''}>
                    </div>
                    <div class="card-title">${mod.title}</div>
                    <div class="card-desc">${mod.desc}</div>
                `;
                sidebar.appendChild(card);
            });
        }

        function selectModule(index) {
            currentModuleIndex = index;
            renderSidebar();
            renderContent();
        }

        function renderContent() {
            const mod = modules[currentModuleIndex];
            const content = document.getElementById("mainContent");

            let stepsHtml = mod.steps.map((st, i) => `
                <div class="step-block">
                    <div class="step-title">
                        <span>⚡ Paso ${i + 1}: ${st.title}</span>
                    </div>
                    <div class="meta-tags">
                        <span class="tag tag-context">${st.context}</span>
                        <span class="tag">${st.path}</span>
                    </div>
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">${st.desc}</p>
                    
                    <div class="code-container">
                        <button class="copy-btn" onclick="copyCode(this)">Copiar</button>
                        <pre><code>${st.code}</code></pre>
                    </div>

                    <div class="tip-box">
                        <strong>🧪 Verificación Observable:</strong> ${st.verification}
                    </div>
                </div>
            `).join("");

            content.innerHTML = `
                <div class="content-header">
                    <div style="font-size: 0.85rem; font-weight: 700; color: var(--accent-color);">${mod.step}</div>
                    <h1 class="content-title">${mod.title}</h1>
                    <p style="color: var(--text-secondary); font-size: 0.95rem;">${mod.desc}</p>
                </div>
                ${stepsHtml}
            `;
        }

        function copyCode(btn) {
            const pre = btn.nextElementSibling;
            const text = pre.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "¡Copiado!";
                btn.style.backgroundColor = "var(--success-color)";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "var(--btn-copy)";
                }, 2000);
            });
        }

        function toggleTheme() {
            document.body.classList.toggle("light-mode");
            localStorage.setItem("deploy_theme", document.body.classList.contains("light-mode") ? "light" : "dark");
        }

        function toggleCheck(id) {
            const chk = document.getElementById('chk-' + id);
            localStorage.setItem('deploy_chk_' + id, chk.checked);
        }

        // Carga inicial
        if (localStorage.getItem("deploy_theme") === "light") {
            document.body.classList.add("light-mode");
        }

        renderSidebar();
        renderContent();
    </script>
</body>
</html>
